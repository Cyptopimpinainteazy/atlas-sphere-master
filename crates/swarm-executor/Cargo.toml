[package]
name = "swarm-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp-core = { version = "21.0", package = "sp-core", git = "https://github.com/paritytech/substrate.git", rev = "948fbd2" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "sync", "time", "rt-multi-thread"] }

[dev-dependencies]
tokio-test = "0.4"
