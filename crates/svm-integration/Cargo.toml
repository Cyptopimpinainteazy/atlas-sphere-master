[package]
name = "atlas-svm-integration"
version = "0.1.0"
edition = "2021"
description = "SVM (Solana) integration for Atlas Sphere"
publish = false

[dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

parity-scale-codec = { version = "3.6", default-features = false, features = ["derive"] }

# Conditionally enabled Solana dependencies for the rBPF executor
solana_rbpf = { version = "0.8.5", default-features = false, optional = true }
solana-program = { version = "3.0", default-features = false, optional = true }

# Utility deps for test-data decoding and CPI encoding
hex = { version = "0.4", default-features = false }
base64 = { version = "0.21", default-features = false }

[features]
default = ["std"]
# Enable the rBPF-backed executor and Solana program types when set
rbpf-executor = ["dep:solana_rbpf", "dep:solana-program"]
std = [
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "parity-scale-codec/std",
]

