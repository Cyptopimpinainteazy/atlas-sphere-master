[package]
name = "atlas-evm-integration"
version = "0.1.0"
edition = "2021"
description = "EVM integration for Atlas Sphere"

[dependencies]
# Substrate - use workspace dependencies for consistency with runtime
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-trie = { workspace = true }

# Trie traits (match Substrate's pinned `sp-trie` dependency versions)
trie-db = { version = "0.29.1", default-features = false }

# Frontier (Ethereum compatibility) - Using stable2412 branch to match polkadot-sdk version
fp-evm = { git = "https://github.com/paritytech/frontier", branch = "stable2412", default-features = false }
fp-rpc = { git = "https://github.com/paritytech/frontier", branch = "stable2412", default-features = false }
pallet-evm = { git = "https://github.com/paritytech/frontier", branch = "stable2412", default-features = false }

# EVM execution engine - Aligned with Frontier's versions
evm = { version = "0.42", default-features = false }
evm-runtime = { version = "0.42", default-features = false }
evm-gasometer = { version = "0.42", default-features = false }

# Atlas Sphere
pallet-atlas-kernel = { path = "../../pallets/atlas-kernel" }

# Ethereum compatibility - Aligned with Frontier (stable2412)
ethereum = { version = "0.15", default-features = false }
ethereum-types = { version = "0.15", default-features = false }

# Serialization / Ethereum trie encoding
rlp = { version = "0.6", default-features = false }

# Cryptography for precompiles
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }

# Extra crypto/math deps used by standard precompiles (native/std only)
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
blake2b_simd = { version = "1.0", default-features = false, optional = true }
substrate-bn = { version = "0.6", default-features = false, optional = true }

# Serialization
serde = { version = "1.0", optional = true }
scale-codec = { package = "parity-scale-codec", version = "3.0", default-features = false, features = ["derive"] }

# Testing
proptest = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros"] }

[features]
default = ["std"]
frontier-executor = []
std = [
    "serde",
    "frame-support/std",
    "frame-system/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-trie/std",
    "trie-db/std",
    "fp-evm/std",
    "fp-rpc/std",
    "pallet-evm/std",
    "pallet-atlas-kernel/std",
    "evm/std",
    "evm-runtime/std",
    "evm-gasometer/std",
    "ethereum/std",
    "ethereum-types/std",
    "rlp/std",
    "scale-codec/std",
    "sha2/std",
    "ripemd/std",
    "num-traits?/std",
    "blake2b_simd?/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
testing = [
    "proptest",
]

# Enable full standard precompile set (0x01..=0x09) when building with std.
full-precompiles = [
    "std",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:blake2b_simd",
    "dep:substrate-bn",
]