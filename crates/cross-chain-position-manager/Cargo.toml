[package]
name = "cross-chain-position-manager"
version = "0.1.0"
edition = "2021"
authors = ["Atlas Sphere Team"]
description = "Universal Cross-Chain Position Manager for Atlas Sphere"
license = "MIT"

[dependencies]
# Core dependencies
parity-scale-codec = { version = "3.0", default-features = false, features = ["derive"] }
scale-info = { version = "2.0", default-features = false, features = ["derive"] }
sp-std = { version = "4.0", default-features = false }
sp-core = { version = "7.0", default-features = false }
sp-runtime = { version = "7.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# External chains integration
atlas-external-chains = { path = "../external-chains", default-features = false }
x3-evolution = { path = "../x3-evolution", default-features = false }
gpu-swarm = { path = "../gpu-swarm", default-features = false }

# Async and networking
tokio = { version = "1.0", features = ["full"], optional = true }
async-trait = "0.1"
futures = "0.3"

# Data structures and storage
dashmap = { version = "5.0", optional = true }
parking_lot = "0.12"
priority-queue = "1.2"

# Cryptographic and hash functions
blake3 = "1.4"
sha2 = "0.10"
hex = "0.4"

# Time and scheduling
chrono = { version = "0.4", features = ["serde"], optional = true }
tokio-cron-scheduler = { version = "0.9", optional = true }

# Cross-chain messaging
libp2p = { version = "0.50", features = ["tcp", "quic", "noise"], optional = true }

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
proptest = "1.0"

[features]
default = ["std", "tokio", "serde_json"]
std = []
tokio = ["async-trait", "chrono", "tokio-cron-scheduler"]
serde_json = ["serde"]
parallel = ["sp-runtime/parallel"]
libp2p = ["async-trait"]
memdb = ["dashmap"]
# Enable all async features
full = ["tokio", "serde_json", "memdb", "libp2p", "parallel"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
