apiVersion: v1
kind: Namespace
metadata:
  name: swarm-media
  labels:
    app: x3-atlas-sphere

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swarm-config
  namespace: swarm-media
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      admin_port: 8081
      metrics_port: 8082
      
    swarm:
      orchestrator:
        max_concurrent_campaigns: 50
        max_agents_per_campaign: 100
        scheduling_interval_ms: 5000
      
      platforms:
        twitter:
          rate_limit: 300
          window_minutes: 15
        instagram:
          rate_limit: 200
          window_minutes: 60
        tiktok:
          rate_limit: 100
          window_minutes: 60
        youtube:
          rate_limit: 50
          window_minutes: 60
        linkedin:
          rate_limit: 250
          window_minutes: 15
    
    tools:
      llm:
        default_model: "gpt-4o"
        max_tokens: 2000
        temperature: 0.7
      
      image:
        default_model: "flux-pro"
        default_width: 1024
        default_height: 1024
      
      video:
        default_model: "runway-gen-3-alpha"
        max_duration_seconds: 120
      
      tts:
        default_model: "elevenlabs-multilingual"
        default_voice: "rachel"
    
    compliance:
      frameworks:
        - "GDPR"
        - "CCPA"
        - "LGPD"
      
      require_disclosure: true
      require_approval_for_sensitive: true
      audit_retention_days: 2555  # 7 years
    
    analytics:
      metrics_retention_days: 365
      a_b_test_min_duration_hours: 24
      a_b_test_max_duration_hours: 168
      decay_detection_enabled: true
      decay_threshold: 0.7

---
apiVersion: v1
kind: Secret
metadata:
  name: swarm-secrets
  namespace: swarm-media
type: Opaque
stringData:
  openai-api-key: "${OPENAI_API_KEY}"
  anthropic-api-key: "${ANTHROPIC_API_KEY}"
  replicate-api-token: "${REPLICATE_API_TOKEN}"
  runway-api-key: "${RUNWAY_API_KEY}"
  elevenlabs-api-key: "${ELEVENLABS_API_KEY}"
  twitter-api-key: "${TWITTER_API_KEY}"
  twitter-api-secret: "${TWITTER_API_SECRET}"
  instagram-access-token: "${INSTAGRAM_ACCESS_TOKEN}"
  tiktok-api-key: "${TIKTOK_API_KEY}"
  youtube-api-key: "${YOUTUBE_API_KEY}"
  linkedin-api-key: "${LINKEDIN_API_KEY}"
  database-url: "${DATABASE_URL}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-media-orchestrator
  namespace: swarm-media
  labels:
    app: swarm-media
    component: orchestrator
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: swarm-media
      component: orchestrator
  
  template:
    metadata:
      labels:
        app: swarm-media
        component: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    
    spec:
      serviceAccountName: swarm-media
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: swarm-media
        image: x3-atlas-sphere/swarm-media:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: admin
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 8082
          protocol: TCP
        
        env:
        - name: RUST_LOG
          value: "info"
        - name: SWARM_ENV
          value: "production"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        
        # API Keys from secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: anthropic-api-key
        - name: REPLICATE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: replicate-api-token
        - name: RUNWAY_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: runway-api-key
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: elevenlabs-api-key
        
        # Social media keys
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: twitter-api-key
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: twitter-api-secret
        - name: INSTAGRAM_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: instagram-access-token
        - name: TIKTOK_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: tiktok-api-key
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: youtube-api-key
        - name: LINKEDIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: linkedin-api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: database-url
        
        # Config volumes
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
        
        # Probes
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        
        # Resource limits
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: config
        configMap:
          name: swarm-config
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: logs
        emptyDir:
          sizeLimit: 2Gi
      
      # Pod disruption budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - swarm-media
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: swarm-media
  namespace: swarm-media
  labels:
    app: swarm-media
spec:
  type: ClusterIP
  selector:
    app: swarm-media
    component: orchestrator
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: admin
    port: 8081
    targetPort: admin
    protocol: TCP
  - name: metrics
    port: 8082
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarm-media
  namespace: swarm-media

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swarm-media
  namespace: swarm-media
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swarm-media
  namespace: swarm-media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swarm-media
subjects:
- kind: ServiceAccount
  name: swarm-media
  namespace: swarm-media

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swarm-media-hpa
  namespace: swarm-media
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swarm-media-orchestrator
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: swarm-media-pdb
  namespace: swarm-media
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: swarm-media
      component: orchestrator
