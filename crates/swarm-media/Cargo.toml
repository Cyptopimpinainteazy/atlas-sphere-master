[package]
name = "swarm-media"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies that are no_std compatible
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
base64 = { version = "0.21", default-features = false, features = ["alloc"] }
thiserror = "1.0"
anyhow = "1.0"

# Optional std-only dependencies
async-trait = { version = "0.1", optional = true }
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
chrono-tz = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
flate2 = { version = "1.0", optional = true }

# Heavy std-only dependencies (actix, sqlx, tokio, reqwest)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json", "chrono"], optional = true }
reqwest = { version = "0.11", features = ["json", "multipart"], optional = true }
actix-web = { version = "4.4", optional = true }
actix-rt = { version = "2.8", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "macros"] }

[features]
default = ["std"]
std = [
    "serde/std",
    "serde_json/std",
    "sha2/std",
    "hex/std",
    "base64/std",
    "async-trait",
    "uuid",
    "chrono",
    "chrono-tz",
    "tracing",
    "tracing-subscriber",
    "flate2",
    "sqlx",
    "reqwest",
    "actix-web",
    "actix-rt",
    "tokio",
]