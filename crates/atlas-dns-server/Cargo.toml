# Atlas Sphere DNS Server - .x3 TLD Authoritative DNS Server
[package]
name = "atlas-dns-server"
version = "0.1.0"
edition = "2021"
authors = ["Atlas Sphere Team"]
description = "Authoritative DNS server for .x3 TLD with blockchain integration"
license = "MIT"
repository = "https://github.com/Cyptopimpinainteazy/atlas-sphere"

[dependencies]
# Core DNS dependencies
trust-dns-server = "0.23"
trust-dns-resolver = "0.23"
trust-dns-proto = "0.23"
trust-dns-client = "0.23"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Data structures and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres"] }
rusqlite = { version = "0.30", features = ["bundled"], optional = true }

# Blockchain integration
parity-scale-codec = "3.6"
sp-core = { version = "22", default-features = false, features = ["std"] }
sp-runtime = { version = "24", default-features = false, features = ["std"] }

# Networking and HTTP
axum = "0.7"
tower = "0.4"
hyper = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Cryptography for DNSSEC
ring = "0.17"
ed25519-dalek = "2.0"
secp256k1 = { version = "0.27", features = ["recovery"] }
sha2 = "0.10"

# Configuration and logging
config = "0.13"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"

# Utilities
rand = "0.8"
hex = "0.4"

# Time and dates
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# Monitoring and metrics
prometheus = "0.13"
metrics = "0.22"

[dev-dependencies]
tempfile = "3.0"
mockall = "0.12"

[features]
default = ["sqlite", "postgres"]
sqlite = ["rusqlite"]
postgres = ["sqlx/postgres"]

[[bin]]
name = "atlas-dns-server"
path = "src/main.rs"
